name: Relato de erro
description: Relate uma falha do Harness (comportamento inesperado, travamento, problema de instalação etc.)
title: "[bug] "
labels: ["bug", "needs-triage"]
assignees:
  - revfactory
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar o problema.

        Antes de enviar, confira as issues abertas para evitar duplicatas.

        **Prazo de triagem:** buscamos classificar novas issues em até 48 horas e apresentar uma resposta substancial em até 72 horas úteis (veja [CONTRIBUTING.md](../../CONTRIBUTING.md)).

  - type: input
    id: claude-code-version
    attributes:
      label: Versão do Claude Code
      description: Resultado de `claude --version` (por exemplo, `2.3.1`)
      placeholder: "2.x.y"
    validations:
      required: true

  - type: dropdown
    id: experimental-flag
    attributes:
      label: Estado da flag experimental de equipes
      description: A variável `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1` está definida no ambiente em que o problema ocorreu?
      options:
        - "Sim, a flag está definida como 1"
        - "Não, a flag não está definida"
        - "Não sei / não se aplica"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Etapas para reproduzir
      description: Descreva o caminho mínimo para reproduzir a falha, incluindo comandos, configurações e entradas.
      placeholder: |
        1. `claude plugin marketplace add harness@harness`
        2. `export CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`
        3. `claude "Crie um harness para ..."`
        4. Ocorre ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
      description: O que aconteceu de fato? Inclua mensagens de erro e stack traces sem modificações.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema operacional
      options:
        - "macOS"
        - "Linux"
        - "Windows (WSL)"
        - "Windows (nativo)"
        - "Outro (descreva abaixo)"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional (opcional)
      description: Logs, capturas de tela ou outros detalhes úteis. Oculte informações sensíveis.
    validations:
      required: false
