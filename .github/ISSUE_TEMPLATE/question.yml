name: Pergunta
description: Faça uma pergunta de uso ou peça esclarecimentos sobre o Harness
title: "[question] "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Perguntas são bem-vindas. Para dúvidas abertas ou que convidem à discussão, o [GitHub Discussions](https://github.com/revfactory/harness/discussions) costuma ser mais adequado.

        Procuramos fazer a triagem de perguntas em até 48 horas.

  - type: textarea
    id: question
    attributes:
      label: Sua pergunta
      description: O que você gostaria de saber?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: O que você já tentou?
      description: Comandos executados, documentação consultada e issues relacionadas.
    validations:
      required: false

  - type: textarea
    id: docs
    attributes:
      label: Documentação ou links relacionados (opcional)
      description: Inclua links para seções de README, documentação ou issues que você já consultou.
    validations:
      required: false
