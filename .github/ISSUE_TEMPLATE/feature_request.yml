name: Solicitação de funcionalidade
description: Proponha uma nova capacidade ou melhoria para o Harness
title: "[feat] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela sugestão. Novas funcionalidades normalmente exigem discussão; ajude-nos a entender o motivo antes de definir a solução.

        Para propostas de maior alcance (como um novo padrão de arquitetura, suporte a outro runtime ou mudanças incompatíveis de API), considere começar pelo [GitHub Discussions](https://github.com/revfactory/harness/discussions).

  - type: textarea
    id: problem
    attributes:
      label: Que problema essa proposta resolve?
      description: Descreva uma dificuldade concreta do usuário ou do desenvolvimento.
      placeholder: |
        Ao montar uma equipe para ___, preciso ___ manualmente porque ___.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
      description: Descreva sua proposta. Inclua um esboço de API, CLI ou workflow, se pertinente.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Quais outras abordagens você avaliou e por que não as escolheu?
    validations:
      required: false

  - type: dropdown
    id: related-pattern
    attributes:
      label: Padrão de arquitetura de equipe relacionado (se houver)
      description: A qual dos seis padrões internos a proposta está mais relacionada?
      options:
        - "Não se aplica a um padrão específico"
        - "Pipeline"
        - "Fan-out / Fan-in"
        - "Pool de Especialistas"
        - "Produção–Revisão"
        - "Supervisor"
        - "Delegação Hierárquica"
        - "Novo padrão (descreva abaixo)"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Contexto adicional (opcional)
      description: Links, trabalhos relacionados, capturas de tela ou outras informações.
    validations:
      required: false
